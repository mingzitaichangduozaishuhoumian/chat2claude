name: Release packages

on:
  push:
    tags: ['v*']
  # Manual runs build and test artifacts only; they never publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CHATGPT_BACKEND: mock
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Validate package and tag versions
        id: version
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const paths = ['package.json', 'apps/api/package.json', 'packages/chatgpt-backend/package.json', 'packages/claude-protocol/package.json', 'packages/protocol-mapper/package.json', 'packages/shared/package.json'];
          const packages = paths.map(path => JSON.parse(readFileSync(path, 'utf8')));
          const version = packages[0].version;
          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid release version.');
          if (packages.some(pkg => pkg.version !== version)) throw new Error('Workspace package versions must match.');
          const tag = `v${version}`;
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.RELEASE_REF_NAME !== tag) throw new Error('Release tag must match the package version.');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          NODE
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build, test, and typecheck
        run: corepack pnpm check
      - name: Build release packages from a clean checkout
        run: corepack pnpm package:release
      - name: Smoke test extracted packages
        run: corepack pnpm package:smoke
      - name: Verify release provenance and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('dist-release/release-manifest.json', 'utf8'));
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (manifest.version !== process.env.RELEASE_VERSION || manifest.source?.commit !== commit || manifest.source?.dirty !== false) throw new Error('Release provenance does not match this clean checkout.');
          NODE
          cd dist-release
          sha256sum --check --strict SHA256SUMS
      - name: Extract the current changelog section
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const heading = new RegExp('^##\\s+\\[?v?' + process.env.RELEASE_VERSION.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:\\]|(?=\\s|$))');
          const start = lines.findIndex(line => heading.test(line));
          if (start === -1) throw new Error('The current release is missing from CHANGELOG.md.');
          const next = lines.findIndex((line, index) => index > start && /^##\s/.test(line));
          const notes = lines.slice(start + 1, next === -1 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error('The current release changelog section is empty.');
          writeFileSync('dist-release/RELEASE_NOTES.md', notes + '\n');
          NODE
      - name: Upload verified packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          path: |
            dist-release/chat2claude-v${{ steps.version.outputs.version }}-node.zip
            dist-release/chat2claude-v${{ steps.version.outputs.version }}-node.tar.gz
            dist-release/chat2claude-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist-release/SHA256SUMS
            dist-release/release-manifest.json
            dist-release/RELEASE_NOTES.md
      - name: Explain manual dry run
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Manual dry run. Packages are available as workflow artifacts; no GitHub Release will be published.' >> "$GITHUB_STEP_SUMMARY"

  windows-smoke:
    name: Verify bundled Windows runtime
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CHATGPT_BACKEND: mock
      TZ: UTC
    steps:
      - name: Check out smoke-test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked smoke-test dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist-release
          digest-mismatch: error
      - name: Smoke test with bundled node.exe
        run: corepack pnpm package:smoke --dir dist-release

  publish:
    name: Publish tag release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist-release
          digest-mismatch: error
      - name: Verify checksums again before publishing
        working-directory: dist-release
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist-release/chat2claude-v${RELEASE_VERSION}-node.zip"
            "dist-release/chat2claude-v${RELEASE_VERSION}-node.tar.gz"
            "dist-release/chat2claude-v${RELEASE_VERSION}-windows-x64.zip"
            "dist-release/SHA256SUMS"
            "dist-release/release-manifest.json"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          publish_draft=false
          if gh release view "$RELEASE_TAG" --json assets,isDraft > "$RUNNER_TEMP/release-metadata.json"; then
            jq -r '.assets[].name' "$RUNNER_TEMP/release-metadata.json" > "$RUNNER_TEMP/release-assets.txt"
            if jq -e '.isDraft == true' "$RUNNER_TEMP/release-metadata.json" > /dev/null; then publish_draft=true; fi
            for asset in "${assets[@]}"; do
              if grep -Fxq "${asset##*/}" "$RUNNER_TEMP/release-assets.txt"; then
                echo "Refusing to replace existing release asset: ${asset##*/}" >&2
                exit 1
              fi
            done
          else
            options=(--draft --verify-tag --title "$RELEASE_TAG" --notes-file dist-release/RELEASE_NOTES.md)
            if [[ "$RELEASE_VERSION" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${options[@]}"
            publish_draft=true
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          if [[ "$publish_draft" == true ]]; then gh release edit "$RELEASE_TAG" --draft=false; fi
