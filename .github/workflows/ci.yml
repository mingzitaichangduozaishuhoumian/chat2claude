name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.15.0', '24']
    env:
      CHATGPT_BACKEND: mock
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build, test, and typecheck
        run: corepack pnpm check
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: corepack pnpm audit --audit-level=moderate
      - name: Build release packages
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: corepack pnpm package:release
      - name: Smoke test extracted packages
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: corepack pnpm package:smoke
